name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build web project
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install ldid for fake-signing
        run: |
          brew install ldid || true

      - name: Setup CodeSign bypass wrapper
        run: |
          mkdir -p /tmp/codesign-bin
          cat << 'EOF' > /tmp/codesign-bin/codesign
          #!/bin/bash
          if [[ "$*" == *"--version"* ]]; then
            /usr/bin/codesign "$@"
            exit $?
          fi
          echo "Codesign wrapper invoked for: ${@: -1}"
          /usr/bin/codesign --force --sign - "${@: -1}" 2>/dev/null || true
          exit 0
          EOF
          chmod +x /tmp/codesign-bin/codesign

      - name: Build unsigned .app with Xcode
        run: |
          export PATH="/tmp/codesign-bin:$PATH"
          cd ios/App
          
          # Resolve SPM packages
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -clonedSourcePackagesDirPath .spm || true
          
          # Build App.app without requiring Apple Developer signing
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build

      - name: Fake-sign with ldid and Package into .ipa
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching in alternate paths..."
            APP_PATH=$(find . -name "App.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app was not found!"
            exit 1
          fi
          
          echo "Found App.app at: $APP_PATH"
          
          # Apply ldid fake signature
          if command -v ldid &> /dev/null; then
            echo "Applying ldid fake-signature..."
            ldid -S "$APP_PATH" || ldid -S "$APP_PATH/App" || true
          fi
          
          # Package into Payload/
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Trouvaille-unsigned.ipa Payload
          echo "Successfully created Trouvaille-unsigned.ipa ($(du -h Trouvaille-unsigned.ipa | cut -f1))"

      - name: Upload .ipa as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trouvaille-unsigned-ipa
          path: Trouvaille-unsigned.ipa
          if-no-files-found: error
