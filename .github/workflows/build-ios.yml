name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build web project
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Ad-Hoc unsigned .app (AltStore Sideloading)
        run: |
          cd ios/App
          
          # Resolve SPM packages
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -clonedSourcePackagesDirPath .spm || true
          
          # Build .app with ad-hoc signing (no Apple Developer account required)
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build

      - name: Package into .ipa
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          echo "Packaging App.app from: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Trouvaille-unsigned.ipa Payload

      - name: Upload .ipa as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trouvaille-unsigned-ipa
          path: Trouvaille-unsigned.ipa
          if-no-files-found: error

